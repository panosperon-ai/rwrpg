<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140e09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Real world RPG</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #100c08; color: #f3e6d0; font: 16px/1.45 Georgia, serif; }
  main { width: min(420px, calc(100% - 32px)); }
  h1 { font-weight: 500; letter-spacing: .04em; margin: 0 0 8px; }
  p { color: #cbb89a; }
  input, button { width: 100%; box-sizing: border-box; font: inherit; }
  input { margin: 8px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #8a6a3b; background: #1b140e; color: inherit; }
  button { padding: 12px 14px; border-radius: 999px; border: 0; background: #e7c27a; color: #2a1c0c; }
  small { display: block; margin-top: 12px; color: #9a866c; }
</style>
</head>
<body>
<main>
  <h1>Real world RPG</h1>
  <p>Βάλε μία φορά το link του παιχνιδιού (τελειώνει σε <b>/exec</b>). Μετά, «Προσθήκη στην αρχική» και ανοίγει σαν εφαρμογή. Τα δεδομένα μένουν στο ίδιο Sheet.</p>
  <form id="f">
    <input id="u" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" required>
    <button type="submit">Άνοιξε το παιχνίδι</button>
  </form>
  <small id="hint"></small>
</main>
<script>
  var KEY = 'rwrpg_exec';
  var u = localStorage.getItem(KEY) || '';
  var input = document.getElementById('u');
  if (u) input.value = u;
  function go(url) {
    localStorage.setItem(KEY, url);
    location.replace(url);
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v)) {
      document.getElementById('hint').textContent = 'Θέλει το πλήρες link που τελειώνει σε /exec.';
      return;
    }
    go(v);
  });
  if (u && window.matchMedia('(display-mode: standalone)').matches) go(u);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
